version: 2

models:
  - name: stg_gl_entries
    description: Grand livre type, cle technique gl_line_id
    columns:
      - name: gl_line_id
        data_tests: [unique, not_null]
      - name: entry_id
        data_tests: [not_null]
      - name: posting_date
        data_tests: [not_null]
      - name: entity_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_entities')
                field: entity_id
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_chart_of_accounts')
                field: account_id
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['EUR', 'GBP', 'USD', 'PLN']

  - name: stg_budget
    columns:
      - name: budget_local
        data_tests: [not_null]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_chart_of_accounts')
                field: account_id

  - name: stg_fx_rates
    columns:
      - name: rate
        data_tests: [not_null]
      - name: rate_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['average', 'end_of_period']

  - name: stg_entities
    columns:
      - name: entity_id
        data_tests: [unique, not_null]

  - name: stg_chart_of_accounts
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: statement
        data_tests:
          - accepted_values:
              arguments:
                values: ['P&L', 'BILAN']
